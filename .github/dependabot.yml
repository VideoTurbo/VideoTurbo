# Weekly dependency updates. Minor and patch updates are grouped into one PR per ecosystem to keep the noise down;
# major updates arrive as separate PRs. Every PR runs the full CI before it can be merged.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # Dependencies exported to deploy/worker/requirements/*.txt. Their PRs fail the requirements check until
      # someone checks out the branch, runs `uv run python tools/export_requirements.py`, and pushes the result.
      python-worker:
        patterns:
          - "pydantic"
          - "pyyaml"
          - "huggingface-hub"
          - "httpx"
          - "psutil"
        update-types: [minor, patch]
      # Orchestrator-only and dev dependencies; these PRs pass CI without manual steps.
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # vue-tsc does not support TypeScript 7 yet (it imports typescript/lib/tsc, which TS 7 no longer exports).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vue-tsc 3.3 reports false `.value` errors on `v-model:value` in templates; stay on 3.2.x until fixed upstream.
      - dependency-name: "vue-tsc"
        update-types: ["version-update:semver-minor"]
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
