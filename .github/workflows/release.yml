# 推送版本标签（例如 v1.2.0，必须与 src/video_turbo/__init__.py 的 __version__ 一致）时发布：
# 1. 运行全部测试；
# 2. 构建主程序镜像（amd64 + arm64）推送到 ghcr.io/videoturbo/videoturbo；
# 3. 创建 GitHub Release，附上 GPU 机器安装包和 docker-compose 示例。
# 标签带“-”（例如 v1.2.0-rc.1）时发布为预发布版本：镜像不更新 latest，Release 标为 Pre-release。
name: 发布

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/videoturbo/videoturbo

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 核对标签与版本号
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/video_turbo/__init__.py)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 __version__（${version}）不一致"
            exit 1
          fi

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3、1.2 和 latest；预发布版本只打完整版本号。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 打包服务安装包
        run: python tools/package_release.py --output dist/video-turbo
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes "${flags[@]}" \
            dist/video-turbo.zip dist/video-turbo.tar.gz \
            deploy/server/docker-compose.example.yml
