# 桌面版安装包：主程序应用 Windows（NSIS，按当前用户安装）和 macOS（Apple 芯片，dmg），
# 识别机应用（VideoTurbo Worker）只出 Windows 版。
# PyInstaller 不能跨平台打包，每个平台在各自的 runner 上构建。改动桌面版或主程序代码的 PR 都会构建一次，
# 产物作为 artifact 上传，可下载试用。暂不做代码签名：macOS 只做 ad-hoc 签名，Windows 不签名。
# 发布流程（release.yml）以 release: true 调用：用 TAURI_SIGNING_PRIVATE_KEY 给自动更新包签名，
# 额外生成 .sig 和 macOS 的 .app.tar.gz（desktop/apps/updater.conf.json）。
name: 桌面版

on:
  pull_request:
    paths:
      - "desktop/**"
      - "deploy/desktop/**"
      - "src/**"
      - "web/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: 发布构建：生成并签名自动更新包
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            # app 是自动更新包（.app.tar.gz）的来源。
            bundle: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      # 打包脚本输出中文；Windows 控制台默认代码页不是 UTF-8。
      PYTHONUTF8: "1"
      # 只有发布构建带私钥并生成更新包；PR 构建不需要。
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      UPDATER_CONFIG: ${{ inputs.release && '--config ../updater.conf.json' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      # runner 自带 rustup；仓库只允许 GitHub 官方和已验证发布者的 action，所以不用第三方的 Rust action。
      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: 安装打包依赖
        run: uv sync --locked --python 3.11 --extra orchestrator --extra desktop
      - name: 打包主程序、FFmpeg 和云机部署包
        run: uv run python deploy/desktop/build_sidecar.py
      - name: 外壳代码检查与单元测试
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: 安装 Tauri 命令行工具
        working-directory: desktop
        run: npm ci
      - name: 构建安装包
        working-directory: desktop/apps/videoturbo
        run: npx --prefix ../.. tauri build --bundles ${{ matrix.bundle }} ${{ env.UPDATER_CONFIG }}
      # 独立的识别机应用只出 Windows 版。
      - name: 构建识别机安装包
        if: runner.os == 'Windows'
        working-directory: desktop/apps/worker
        run: npx --prefix ../.. tauri build --bundles nsis ${{ env.UPDATER_CONFIG }}
      - uses: actions/upload-artifact@v7
        with:
          name: VideoTurbo-${{ runner.os }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/nsis/*.exe.sig
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/macos/*.app.tar.gz
            desktop/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
