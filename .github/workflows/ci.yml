# 提交到 main 和每个 PR 都运行；发布流程（release.yml）也先调用它，测试不过不发布。
name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # 一部分测试真实调用 FFmpeg。
      - name: 安装 FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: 安装依赖
        run: uv sync --locked --python 3.11 --extra orchestrator --extra worker --extra dev
      - name: 代码检查
        run: uv run ruff check src tests tools deploy/desktop
      # 显卡电脑按 deploy/worker/requirements/ 安装，清单必须与 uv.lock 一致。
      - name: 检查显卡电脑依赖清单
        run: uv run python tools/export_requirements.py --check
      - name: 单元测试
        run: uv run pytest -q

  # 桌面版主程序也跑在 Windows 上：路径写法（盘符、\ 分隔）只有在 Windows 上才测得出来。
  python-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # 与桌面版一致：外壳以 UTF-8 模式启动主程序，读写文件不受系统代码页影响。
      PYTHONUTF8: "1"
      # 测试超过 60 秒未结束时打印协程停在哪里（见 tests/conftest.py）。
      VIDEO_TURBO_TEST_DUMP_AFTER: "60"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: 安装 FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: 安装依赖
        run: uv sync --locked --python 3.11 --extra orchestrator --extra worker --extra dev
      - name: 单元测试
        # -v：每个测试开始时先打印名字，卡住超时时能看出是哪一个。
        run: uv run pytest -v -rfE --timeout=120

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 单元测试
        run: npm test
      - name: 类型检查与构建
        run: npm run build
