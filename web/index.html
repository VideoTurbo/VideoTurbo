<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VideoTurbo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // 桌面版外壳在页面加载前告诉我们标题栏样式（见 src/lib/shell.ts），样式表按它给窗口按钮让位。
      if (window.__VIDEO_TURBO_TITLEBAR__) document.documentElement.dataset.titlebar = window.__VIDEO_TURBO_TITLEBAR__
      // 提前恢复主题，避免刷新时先闪现另一种深浅色。规则与 src/theme.ts 一致。
      try {
        var mode = null
        try { mode = localStorage.getItem('video-turbo-theme') } catch (error) {}
        if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = window.__VIDEO_TURBO_SHELL_THEME__
        if (mode !== 'light' && mode !== 'dark') {
          mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = mode
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
