<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoTurbo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { padding: 20px 24px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
    .head { display: flex; align-items: center; gap: 12px; }
    .head h2 { font-size: 15px; margin: 0; flex: 1; }
    .help { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    .switch { position: relative; width: 42px; height: 24px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 12px; cursor: pointer; transition: background .15s; }
    .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .state { font-weight: 600; }
    .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 10px 0 6px; }
    .bar div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
    .line { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 16px; }
    pre { white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow: auto; font-size: 11.5px;
          background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px 0 0; }
    .warn { color: var(--bad); font-size: 12.5px; margin: 8px 0 0; }
    footer { display: flex; gap: 8px; justify-content: flex-end; }
    .models-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .models-head h3 { font-size: 14px; margin: 0; }
    .models-mode { font-size: 12px; color: var(--muted); }
    .model-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .model-row:first-child { border-top: 0; }
    .model-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .model-text small { color: var(--muted); font-size: 11.5px; }
    .model-size { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .model-done { color: var(--good, #2f9e44); font-size: 12px; white-space: nowrap; }
    .model-variant { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); max-width: 190px; }
    .model-use { padding: 2px 8px; font-size: 12px; }
    .model-remove { padding: 2px 8px; font-size: 12px; }
    .tag { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--accent); color: #fff; white-space: nowrap; }
    .models-rows { margin-top: 6px; }
    .models-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .picker { margin: 10px 0; padding: 4px 12px 10px; border: 1px solid var(--line); border-radius: 8px; }
    .picker .models-head { padding-top: 8px; }
    .models-note { font-size: 12px; color: var(--muted); flex: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="head">
        <h2 id="t-title"></h2>
        <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
      </div>
      <p class="help" id="t-help"></p>
      <p class="warn" id="no-gpu" hidden></p>
      <div id="choose" hidden>
        <p class="help" id="t-choose"></p>
        <div id="choose-models" class="picker"></div>
        <footer>
          <button id="choose-cancel"></button>
          <button id="choose-later"></button>
          <button class="primary" id="choose-now"></button>
        </footer>
      </div>
    </section>
    <section id="status-box">
      <div class="state" id="state"></div>
      <div id="progress" hidden>
        <div class="bar"><div id="bar"></div></div>
        <div class="line" id="step"></div>
      </div>
      <div class="line" id="line"></div>
      <p class="help" id="hint"></p>
      <pre id="detail" hidden></pre>
    </section>
    <section id="models" hidden></section>
    <footer>
      <button class="primary" id="download" hidden></button>
      <button id="tools" hidden></button>
      <button id="retry" hidden></button>
      <button id="logs"></button>
    </footer>
  </main>
  <script src="models.js"></script>
  <script>
    const zh = (navigator.language || '').toLowerCase().startsWith('zh')
    const T = zh ? {
      title: '本机识别', help: '让这台电脑也处理语音识别任务。第一次开启时会下载运行环境和当前识别模式需要的模型，之后不用再下载。与桌面、游戏共用显卡时，只在显卡空闲时接单。',
      noGpu: '没有检测到 NVIDIA 显卡，识别会用 CPU，速度很慢。', macCpu: 'Mac 上识别使用 CPU，速度比 NVIDIA 显卡慢很多。',
      off: '未开启', waiting: '正在连接主程序…', installing: '正在安装运行环境', selfTest: '正在自检已下载的模型',
      running: '运行中：有识别任务时会自动处理', models: '正在下载模型', failed: '出错了', conflict: '这台电脑上的 VideoTurbo Worker 正在使用显卡，它停下后会自动接手', needTools: '需要先安装 Apple 的命令行开发工具（含 Git）',
      needToolsHint: '点“安装命令行工具”，在弹出的窗口里按提示安装，装好后点“重试”。', tools: '安装命令行工具', retry: '重试', logs: '打开日志文件夹',
      pending: '等待下载', pendingHint: '还没有下载运行环境或识别模型，下载好之前这台电脑不会接识别任务。方便时点“开始下载”，或在下面的清单里选模型下载。', download: '开始下载',
      choose: '开启后要下载运行环境（{env}）和下面勾选的模型（默认勾选当前识别模式需要的）。现在下载，还是先开启、等方便时再下载？', envWin: 'Windows 约 3.6 GB', envMac: '约 1 GB', modelStep: '{name}：{done} / {total}', chooseNow: '立即下载', chooseLater: '稍后下载', cancel: '取消',
    } : {
      title: 'Local recognition', help: 'Let this computer process speech recognition jobs too. The first time downloads the program environment and the models the current recognition mode needs. When the GPU is shared with your desktop or games, jobs are only taken while it is idle.',
      noGpu: 'No NVIDIA GPU detected; recognition will use the CPU and be very slow.', macCpu: 'On a Mac, recognition uses the CPU and is much slower than an NVIDIA GPU.',
      off: 'Off', waiting: 'Connecting to the main app…', installing: 'Installing the program environment', selfTest: 'Testing the downloaded models',
      running: 'Running: jobs are processed automatically', models: 'Downloading models', failed: 'Something went wrong', conflict: 'VideoTurbo Worker on this computer is using the GPU; this takes over when it stops', needTools: "Apple's command line developer tools (including Git) are needed",
      needToolsHint: 'Click "Install command line tools", follow the prompts, then click "Retry".', tools: 'Install command line tools', retry: 'Retry', logs: 'Open logs folder',
      pending: 'Waiting to download', pendingHint: "The program environment or models aren't downloaded yet; this computer won't take recognition jobs until they are. Click \"Download now\" when convenient, or pick models in the list below.", download: 'Download now',
      choose: 'Turning this on downloads the program environment ({env}) and the models ticked below (those the current recognition mode needs are ticked). Download now, or turn on and download later?', envWin: 'about 3.6 GB on Windows', envMac: 'about 1 GB', modelStep: '{name}: {done} / {total}', chooseNow: 'Download now', chooseLater: 'Download later', cancel: 'Cancel',
    }
    const { invoke } = window.__TAURI__.core
    const $ = (id) => document.getElementById(id)
    $('t-title').textContent = T.title
    $('t-help').textContent = T.help
    $('tools').textContent = T.tools
    $('retry').textContent = T.retry
    $('logs').textContent = T.logs
    $('download').textContent = T.download
    const updateModels = window.ModelList($('models'), {
      download: (ids) => invoke('worker_models_download', { ids }).then(refresh),
      remove: (id) => invoke('worker_model_delete', { id }).then(refresh),
      select: (id, value) => invoke('worker_model_select', { id, value }).then(refresh),
    })
    invoke('worker_models_refresh')
    $('choose-now').textContent = T.chooseNow
    $('choose-later').textContent = T.chooseLater
    $('choose-cancel').textContent = T.cancel
    let busy = false
    let view = null

    const picker = window.ModelList($('choose-models'), {}, { picker: true })

    async function setEnabled(enabled, download, models = null) {
      busy = true
      $('choose').hidden = true
      try { await invoke('worker_set', { enabled, download, models }) } finally { busy = false }
      refresh()
    }
    $('enabled').onchange = async () => {
      const enabled = $('enabled').checked
      // 还要下载时先问：下载哪些模型，立即下载还是先开启、稍后再下载。
      if (enabled && view && !view.ready) {
        busy = true
        $('choose').hidden = false
        picker(await invoke('worker_model_choices'), false)
        return
      }
      setEnabled(enabled, enabled)
    }
    $('choose-now').onclick = () => setEnabled(true, true, picker.selection())
    $('choose-later').onclick = () => setEnabled(true, false, picker.selection())
    $('choose-cancel').onclick = () => { $('choose').hidden = true; busy = false; $('enabled').checked = false }
    $('download').onclick = () => invoke('worker_download').then(refresh)
    $('retry').onclick = () => invoke('worker_download').then(refresh)
    $('tools').onclick = () => invoke('worker_install_tools')
    $('logs').onclick = () => invoke('worker_open_logs')

    function render(v) {
      view = v
      if (!busy) $('enabled').checked = view.enabled
      const warn = view.platform === 'macos' ? T.macCpu : view.nvidia === false ? T.noGpu : ''
      $('no-gpu').textContent = warn
      $('no-gpu').hidden = !warn || !view.enabled
      $('t-choose').textContent = T.choose.replace('{env}', view.platform === 'macos' ? T.envMac : T.envWin)
      const labels = { off: T.off, waiting: T.waiting, installing: T.installing, models: T.models, self_test: T.selfTest,
                       running: T.running, failed: T.failed, need_tools: T.needTools, conflict: T.conflict, pending: T.pending }
      $('state').textContent = labels[view.phase] || view.phase
      const installing = view.phase === 'installing'
      const downloading = view.phase === 'models'
      $('progress').hidden = !installing && !downloading
      if (installing) {
        $('bar').style.width = `${Math.round(((view.index - 1) / Math.max(view.total, 1)) * 100)}%`
        $('step').textContent = `${view.index}/${view.total} ${zh ? view.zh : view.en}`
      }
      if (downloading) {
        const mb = (value) => (value >= 1024 ? `${(value / 1024).toFixed(1)} GB` : `${value} MB`)
        $('bar').style.width = `${Math.round((view.done_mb / Math.max(view.total_mb, 1)) * 100)}%`
        const name = `${view.index}/${view.total} ${zh ? view.zh : view.en}`
        $('step').textContent = T.modelStep.replace('{name}', name).replace('{done}', mb(view.done_mb)).replace('{total}', mb(view.total_mb))
      }
      updateModels(view.catalog || null, ['waiting', 'installing', 'models', 'self_test'].includes(view.phase))
      $('line').textContent = view.line || ''
      $('hint').textContent = view.phase === 'need_tools' ? T.needToolsHint : view.phase === 'pending' ? T.pendingHint
        : view.phase === 'failed' ? view.message : ''
      $('detail').textContent = view.detail || ''
      $('detail').hidden = !view.detail
      $('tools').hidden = view.phase !== 'need_tools'
      $('download').hidden = view.phase !== 'pending'
      $('retry').hidden = !(view.enabled && (view.phase === 'failed' || view.phase === 'need_tools'))
    }

    async function refresh() {
      try { render(await invoke('worker_state')) } catch (error) { console.error(error) }
    }
    refresh()
    setInterval(refresh, 700)
  </script>
</body>
</html>
