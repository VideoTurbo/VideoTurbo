<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoTurbo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { padding: 22px 24px; }
    .head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
    .head img { width: 52px; height: 52px; }
    h1 { font-size: 16px; margin: 0; }
    .gpu { color: var(--muted); font-size: 13px; margin-top: 2px; }
    p { font-size: 13px; margin: 0 0 10px; }
    .help { font-size: 12px; color: var(--muted); }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .actions button { width: 100%; padding: 8px 16px; }
  </style>
</head>
<body>
  <main>
    <div class="head">
      <img src="logo.png" alt="">
      <div><h1 id="title"></h1><div class="gpu" id="gpu"></div></div>
    </div>
    <p id="lead"></p>
    <p class="help" id="help"></p>
    <div class="actions">
      <button class="primary" id="now"></button>
      <button id="later"></button>
      <button id="no"></button>
    </div>
  </main>
  <script>
    const zh = (navigator.language || '').toLowerCase().startsWith('zh')
    const T = zh ? {
      title: '检测到 NVIDIA 显卡', lead: '要用这块显卡识别字幕吗？开启后这台电脑会自动处理识别任务，不用另装显卡电脑。',
      help: '需要下载运行环境（约 3.6 GB）和当前识别模式需要的模型（默认的 WhisperJAV 双遍约 7.2 GB），之后不用再下载；也可以先开启，稍后在托盘菜单“本机识别…”里选择要下载的模型。只在显卡空闲时接单，不影响打游戏。',
      now: '开启并立即下载', later: '开启，稍后再下载', no: '暂不开启',
    } : {
      title: 'NVIDIA GPU detected', lead: 'Use this GPU to recognize subtitles? This computer then processes recognition jobs itself, no separate GPU PC needed.',
      help: 'This downloads the program environment (about 3.6 GB) and the models the current recognition mode needs (WhisperJAV two-pass, the default, about 7.2 GB) once; or turn it on now and pick models later under Local recognition… in the tray menu. Jobs are only taken while the GPU is idle.',
      now: 'Turn on and download now', later: 'Turn on, download later', no: 'Not now',
    }
    const { invoke } = window.__TAURI__.core
    const $ = (id) => document.getElementById(id)
    for (const key of ['title', 'lead', 'help', 'now', 'later', 'no']) $(key).textContent = T[key]
    invoke('gpu_prompt').then((info) => { $('gpu').textContent = info.name || '' })
    for (const choice of ['now', 'later', 'no']) $(choice).onclick = () => invoke('gpu_choose', { choice })
  </script>
</body>
</html>
