<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoTurbo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { padding: 22px 24px; }
    .head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
    .head img { width: 52px; height: 52px; }
    h1 { font-size: 16px; margin: 0; }
    .gpu { color: var(--muted); font-size: 13px; margin-top: 2px; }
    p { font-size: 13px; margin: 0 0 10px; }
    .help { font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
    .picker { margin: 10px 0 0; padding: 4px 12px 10px; border: 1px solid var(--line); border-radius: 8px; }
    .picker .models-head { padding-top: 8px; }
    .models-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .models-head h3 { font-size: 14px; margin: 0; }
    .models-mode { font-size: 12px; color: var(--muted); }
    .model-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .model-row:first-child { border-top: 0; }
    .model-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .model-text small { color: var(--muted); font-size: 11.5px; }
    .model-size { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .model-done { color: var(--good, #2f9e44); font-size: 12px; white-space: nowrap; }
    .model-remove { padding: 2px 8px; font-size: 12px; }
    .tag { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--accent); color: #fff; white-space: nowrap; }
    .models-rows { margin-top: 6px; }
    .models-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .picker { margin: 10px 0; padding: 4px 12px 10px; border: 1px solid var(--line); border-radius: 8px; }
    .picker .models-head { padding-top: 8px; }
    .models-note { font-size: 12px; color: var(--muted); flex: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="head">
      <img src="logo.png" alt="">
      <div><h1 id="title"></h1><div class="gpu" id="gpu"></div></div>
    </div>
    <p id="lead"></p>
    <p class="help" id="help"></p>
    <div id="models" class="picker" hidden></div>
    <div class="actions">
      <button id="no"></button>
      <button id="later"></button>
      <button class="primary" id="now"></button>
    </div>
  </main>
  <script src="models.js"></script>
  <script>
    const zh = (navigator.language || '').toLowerCase().startsWith('zh')
    const T = zh ? {
      title: '检测到 NVIDIA 显卡', lead: '要用这块显卡识别字幕吗？开启后这台电脑会自动处理识别任务，不用另装显卡电脑。',
      help: '需要下载运行环境（约 3.6 GB）和下面勾选的模型（默认勾选当前识别模式需要的），之后不用再下载；可以现在下载，也可以先开启、稍后再下载。只在显卡空闲时接单，不影响打游戏。',
      now: '开启并立即下载', later: '开启，稍后再下载', no: '暂不开启',
    } : {
      title: 'NVIDIA GPU detected', lead: 'Use this GPU to recognize subtitles? This computer then processes recognition jobs itself, no separate GPU PC needed.',
      help: 'This downloads the program environment (about 3.6 GB) and the models ticked below (those the current recognition mode needs are ticked) once; download now, or turn it on and download later. Jobs are only taken while the GPU is idle.',
      now: 'Turn on and download now', later: 'Turn on, download later', no: 'Not now',
    }
    const { invoke } = window.__TAURI__.core
    const $ = (id) => document.getElementById(id)
    for (const key of ['title', 'lead', 'help', 'now', 'later', 'no']) $(key).textContent = T[key]
    const picker = window.ModelList($('models'), {}, { picker: true })
    // 弹窗可能比主程序先就绪：读不到当前识别模式时每 2 秒再问一次，最多 30 秒。
    async function load(tries) {
      const info = await invoke('gpu_prompt')
      $('gpu').textContent = info.name || ''
      picker(info.catalog, false)
      if (!info.catalog.mode && tries > 0) setTimeout(() => load(tries - 1), 2000)
    }
    load(15)
    for (const choice of ['now', 'later', 'no']) {
      $(choice).onclick = () => invoke('gpu_choose', { choice, models: choice === 'no' ? null : picker.selection() })
    }
  </script>
</body>
</html>
