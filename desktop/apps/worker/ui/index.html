<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoTurbo Worker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { padding: 20px 24px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    header img { width: 44px; height: 44px; }
    header h1 { font-size: 17px; margin: 0; }
    header p { margin: 0; font-size: 12.5px; color: var(--muted); }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
    h2 { font-size: 14px; margin: 0 0 8px; }
    ol { padding-left: 18px; margin: 0 0 10px; font-size: 13px; }
    textarea { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; width: 100%; min-height: 64px; resize: vertical;
               color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .help { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    .warn { color: var(--bad); font-size: 12.5px; margin: 8px 0 0; }
    .state { font-weight: 600; }
    .server { font-size: 12.5px; color: var(--muted); margin-top: 4px; word-break: break-all; }
    .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 10px 0 6px; }
    .bar div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
    .line { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 16px; }
    pre { white-space: pre-wrap; word-break: break-all; max-height: 140px; overflow: auto; font-size: 11.5px;
          background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px 0 0; }
    .models-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .models-head h3 { font-size: 14px; margin: 0; }
    .models-mode { font-size: 12px; color: var(--muted); }
    .model-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .model-row:first-child { border-top: 0; }
    .model-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .model-text small { color: var(--muted); font-size: 11.5px; }
    .model-size { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .model-done { color: var(--good, #2f9e44); font-size: 12px; white-space: nowrap; }
    .model-remove { padding: 2px 8px; font-size: 12px; }
    .tag { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--accent); color: #fff; white-space: nowrap; }
    .models-rows { margin-top: 6px; }
    .models-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .models-note { font-size: 12px; color: var(--muted); flex: 1; }
    .picker { margin: 10px 0 0; padding: 4px 12px 10px; border: 1px solid var(--line); border-radius: 8px; }
    .picker .models-head { padding-top: 8px; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="logo.png" alt="">
      <div><h1>VideoTurbo Worker</h1><p id="t-sub"></p></div>
    </header>

    <section id="setup" hidden>
      <h2 id="t-setup"></h2>
      <ol><li id="t-step1"></li><li id="t-step2"></li></ol>
      <textarea id="code" spellcheck="false"></textarea>
      <p class="warn" id="code-error" hidden></p>
      <p class="help" id="t-download"></p>
      <div id="pick" class="picker"></div>
      <div class="actions">
        <button id="cancel-change" hidden></button>
        <button id="connect-later"></button>
        <button class="primary" id="connect"></button>
      </div>
    </section>

    <section id="status" hidden>
      <div class="state" id="state"></div>
      <div class="server" id="server"></div>
      <div id="progress" hidden>
        <div class="bar"><div id="bar"></div></div>
        <div class="line" id="step"></div>
      </div>
      <div class="line" id="line"></div>
      <p class="help" id="hint"></p>
      <pre id="detail" hidden></pre>
      <div class="actions">
        <button class="primary" id="download" hidden></button>
        <button id="tools" hidden></button>
        <button id="retry" hidden></button>
        <button id="pause"></button>
        <button id="change"></button>
        <button id="logs"></button>
      </div>
    </section>
    <section id="models" hidden></section>
    <p class="warn" id="gpu" hidden></p>
  </main>
  <script src="models.js"></script>
  <script>
    const zh = (navigator.language || '').toLowerCase().startsWith('zh')
    const T = zh ? {
      sub: '让这台显卡电脑为 VideoTurbo 识别字幕', setup: '连接主程序',
      step1: '在 VideoTurbo 控制台打开“云主机 → 添加显卡电脑”，复制接入串。', step2: '粘贴到下面，点“连接”。',
      download: '需要下载运行环境（约 3.6 GB）和下面勾选的模型（粘贴接入串后按主程序当前的识别模式勾选），之后不用再下载；可以现在下载，也可以先连接、等方便时再下载。与桌面、游戏共用显卡时，只在显卡空闲时接单。',
      connect: '连接并立即下载', connectLater: '连接，稍后下载', cancel: '取消', placeholder: 'VT1:…',
      pending: '等待下载', pendingHint: '还没有下载运行环境或识别模型，下载好之前不会接识别任务。方便时点“开始下载”，或在下面的清单里选模型下载。', startDownload: '开始下载',
      off: '已暂停接单', waiting: '正在连接主程序…', installing: '正在安装运行环境', models: '正在下载模型', selfTest: '正在自检已下载的模型', modelStep: '{name}：{done} / {total}',
      running: '运行中：有识别任务时会自动处理', failed: '出错了', needTools: '需要先安装 Apple 的命令行开发工具（含 Git）',
      conflict: '这台电脑上 VideoTurbo 主程序应用的“本机识别”正在使用显卡，它停下后会自动接手',
      needToolsHint: '点“安装命令行工具”，按提示装好后点“重试”。',
      server: '主程序：{url}', tools: '安装命令行工具', retry: '重试', pause: '暂停接单', resume: '继续接单', change: '更换主程序', logs: '打开日志文件夹',
      noGpu: '没有检测到 NVIDIA 显卡，识别会用 CPU，速度很慢。请先安装 NVIDIA 驱动。', macCpu: 'Mac 上识别使用 CPU，速度比 NVIDIA 显卡慢很多。',
    } : {
      sub: 'Let this GPU computer recognize subtitles for VideoTurbo', setup: 'Connect to the main app',
      step1: 'In the VideoTurbo console, open Cloud hosts → Add GPU computer and copy the connection code.', step2: 'Paste it below and click Connect.',
      download: 'The program environment (about 3.6 GB) and the models ticked below (after pasting the code, those the main app\'s current recognition mode needs are ticked) are downloaded once; download now, or connect first and download when convenient. When the GPU is shared with your desktop or games, jobs are only taken while it is idle.',
      connect: 'Connect and download now', connectLater: 'Connect, download later', cancel: 'Cancel', placeholder: 'VT1:…',
      pending: 'Waiting to download', pendingHint: "The program environment or models aren't downloaded yet; no recognition jobs are taken until they are. Click \"Download now\" when convenient, or pick models in the list below.", startDownload: 'Download now',
      off: 'Paused', waiting: 'Connecting to the main app…', installing: 'Installing the program environment', models: 'Downloading models', selfTest: 'Testing the downloaded models', modelStep: '{name}: {done} / {total}',
      running: 'Running: jobs are processed automatically', failed: 'Something went wrong', needTools: "Apple's command line developer tools (including Git) are needed",
      conflict: 'Local recognition in the VideoTurbo main app on this computer is using the GPU; this takes over when it stops',
      needToolsHint: 'Click "Install command line tools", follow the prompts, then click "Retry".',
      server: 'Main app: {url}', tools: 'Install command line tools', retry: 'Retry', pause: 'Pause', resume: 'Resume', change: 'Change main app', logs: 'Open logs folder',
      noGpu: 'No NVIDIA GPU detected; recognition will use the CPU and be very slow. Install the NVIDIA driver first.', macCpu: 'On a Mac, recognition uses the CPU and is much slower than an NVIDIA GPU.',
    }
    const { invoke } = window.__TAURI__.core
    const $ = (id) => document.getElementById(id)
    const texts = { 't-sub': T.sub, 't-setup': T.setup, 't-step1': T.step1, 't-step2': T.step2, 't-download': T.download,
      connect: T.connect, 'connect-later': T.connectLater, download: T.startDownload, 'cancel-change': T.cancel, tools: T.tools, retry: T.retry, change: T.change, logs: T.logs }
    for (const [id, text] of Object.entries(texts)) $(id).textContent = text
    $('code').placeholder = T.placeholder
    let changing = false
    let view = null
    const updateModels = window.ModelList($('models'), {
      download: (ids) => invoke('models_download', { ids }).then(refresh),
      remove: (id) => invoke('model_delete', { id }).then(refresh),
    })
    invoke('models_refresh')

    const picker = window.ModelList($('pick'), {}, { picker: true })
    let lookup = null
    async function loadChoices() {
      picker(await invoke('model_choices', { code: $('code').value.trim() || null }), false)
    }
    // 粘贴接入串后按主程序当前的识别模式重新勾选。
    $('code').oninput = () => { clearTimeout(lookup); lookup = setTimeout(loadChoices, 500) }
    loadChoices()

    async function connect(download) {
      $('code-error').hidden = true
      try {
        await invoke('connect', { code: $('code').value, download, models: picker.selection() })
        changing = false
        $('code').value = ''
        refresh()
      } catch (error) {
        $('code-error').textContent = String(error)
        $('code-error').hidden = false
      }
    }
    $('connect').onclick = () => connect(true)
    $('connect-later').onclick = () => connect(false)
    $('download').onclick = () => invoke('download').then(refresh)
    $('change').onclick = () => { changing = true; render(view) }
    $('cancel-change').onclick = () => { changing = false; render(view) }
    $('pause').onclick = () => invoke('pause', { paused: !view.paused }).then(refresh)
    $('retry').onclick = () => invoke('retry').then(refresh)
    $('tools').onclick = () => invoke('install_tools')
    $('logs').onclick = () => invoke('open_logs')

    function render(v) {
      if (!v) return
      const setup = !v.configured || changing
      $('setup').hidden = !setup
      $('status').hidden = setup
      $('cancel-change').hidden = !v.configured
      const gpu = v.platform === 'macos' ? T.macCpu : v.nvidia === false ? T.noGpu : ''
      $('gpu').textContent = gpu
      $('gpu').hidden = !gpu
      updateModels(setup ? null : v.catalog || null, ['waiting', 'installing', 'models', 'self_test'].includes(v.phase))
      if (setup) return
      const labels = { off: T.off, waiting: T.waiting, installing: T.installing, models: T.models, self_test: T.selfTest, running: T.running,
                       failed: T.failed, need_tools: T.needTools, conflict: T.conflict, pending: T.pending }
      $('state').textContent = v.paused ? T.off : (labels[v.phase] || v.phase)
      $('server').textContent = v.server_url ? T.server.replace('{url}', v.server_url) : ''
      const installing = v.phase === 'installing'
      const downloading = v.phase === 'models'
      $('progress').hidden = !installing && !downloading
      if (installing) {
        $('bar').style.width = `${Math.round(((v.index - 1) / Math.max(v.total, 1)) * 100)}%`
        $('step').textContent = `${v.index}/${v.total} ${zh ? v.zh : v.en}`
      }
      if (downloading) {
        const mb = (value) => (value >= 1024 ? `${(value / 1024).toFixed(1)} GB` : `${value} MB`)
        $('bar').style.width = `${Math.round((v.done_mb / Math.max(v.total_mb, 1)) * 100)}%`
        const name = `${v.index}/${v.total} ${zh ? v.zh : v.en}`
        $('step').textContent = T.modelStep.replace('{name}', name).replace('{done}', mb(v.done_mb)).replace('{total}', mb(v.total_mb))
      }
      $('line').textContent = v.line || ''
      $('hint').textContent = v.phase === 'need_tools' ? T.needToolsHint : v.phase === 'pending' ? T.pendingHint
        : v.phase === 'failed' ? v.message : ''
      $('detail').textContent = v.detail || ''
      $('detail').hidden = !v.detail
      $('tools').hidden = v.phase !== 'need_tools'
      $('download').hidden = v.phase !== 'pending' || v.paused
      $('retry').hidden = !(v.phase === 'failed' || v.phase === 'need_tools')
      $('pause').textContent = v.paused ? T.resume : T.pause
    }

    async function refresh() {
      try { view = await invoke('state'); render(view) } catch (error) { console.error(error) }
    }
    refresh()
    setInterval(refresh, 700)
  </script>
</body>
</html>
