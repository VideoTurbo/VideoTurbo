# VideoTurbo 桌面版：Tauri 外壳。
# - crates/shell-core：两个应用共用的部分（子进程管理、设置文件、日志、界面文字、识别程序）。
# - crates/shell-tauri：两个应用共用、依赖 Tauri 的部分（自动更新）。
# - apps/videoturbo：主程序应用，带着打包好的主程序（deploy/desktop/build_sidecar.py 生成）。
# - apps/worker：独立的识别机应用（Windows），只带识别程序的源码和 uv，运行环境第一次启动时下载。
[workspace]
resolver = "2"
members = ["crates/shell-core", "crates/shell-tauri", "apps/videoturbo", "apps/worker"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
# File::try_lock（识别程序的互斥锁）需要 1.89。
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
